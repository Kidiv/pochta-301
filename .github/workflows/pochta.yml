name: Почта в Телеграм

on:
  schedule:
    - cron: "*/10 * * * *"   # каждые 10 минут; GitHub может задерживать запуск
  workflow_dispatch:          # и вручную кнопкой Run workflow

permissions:
  contents: read
  actions: read               # скрипт смотрит итоги прошлых запусков, чтобы сообщить о сбое один раз

concurrency:
  group: pochta
  cancel-in-progress: false

jobs:
  pereslat:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Переслать новые письма
        run: python3 pochta_v_telegram.py
        env:
          IMAP_HOST: ${{ secrets.IMAP_HOST }}
          IMAP_USER: ${{ secrets.IMAP_USER }}
          IMAP_PASSWORD: ${{ secrets.IMAP_PASSWORD }}
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          TG_THREAD_ID: ${{ secrets.TG_THREAD_ID }}
          ONLY_FROM: ${{ vars.ONLY_FROM }}
          SKIP_FROM: ${{ vars.SKIP_FROM }}
          GH_TOKEN: ${{ github.token }}
